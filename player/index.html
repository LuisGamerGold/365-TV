<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>365 TV</title>
<link rel="stylesheet" href="player.css" />
</head>
<body>
  <div id="app">
    <main id="screen">

      <div class="video-layer">
        <!-- Dois <video> alternados: enquanto um toca, o outro pre-carrega o
             proximo item em segundo plano (ver video-player.js) - a troca so'
             acontece quando o novo ja' tem o primeiro frame pronto, sem tela
             preta no meio. -->
        <video id="video-el" class="media-el" autoplay muted></video>
        <video id="video-el-2" class="media-el" autoplay muted style="display:none"></video>
        <img id="image-el" class="media-el" style="display:none" />
        <div class="empty-state" id="empty-state">365 TV — adicione videos pelo painel administrativo</div>
      </div>

      <!-- Slots fixos: cada widget e' movido para dentro do slot correspondente
           a sua posicao configurada (ver modules/anchor.js). Varios widgets no
           mesmo slot ficam lado a lado, sem se sobrepor. Ficam por cima tanto
           do video quanto da tela de oferta - so o "meio" da tela muda. -->
      <div class="anchor-slot" id="anchor-top-left" data-pos="top-left"></div>
      <div class="anchor-slot" id="anchor-top-center" data-pos="top-center"></div>
      <div class="anchor-slot" id="anchor-top-right" data-pos="top-right"></div>
      <div class="anchor-slot" id="anchor-bottom-left" data-pos="bottom-left"></div>
      <div class="anchor-slot" id="anchor-bottom-center" data-pos="bottom-center"></div>
      <div class="anchor-slot" id="anchor-bottom-right" data-pos="bottom-right"></div>

      <div class="logo card" id="logo">365 MOTOS</div>

      <!-- Cartao de horario/clima: duas faces empilhadas que se alternam com
           crossfade (ver modules/info-pill.js). -->
      <div class="status-card card" id="info-pill">
        <div class="status-panel datetime-panel active" id="clock-cluster">
          <div class="dt-row">
            <img class="date-icon" src="assets/icons/date-icon.png" alt="" />
            <div class="date-text" id="date">---</div>
          </div>
          <div class="dt-row">
            <img class="clock-icon" src="assets/icons/clock-icon.png" alt="" />
            <div class="time-text" id="clock">--:--</div>
          </div>
        </div>

        <div class="status-panel weather-panel" id="weather">
          <img class="weather-art" src="assets/icons/weather-art.png" alt="" />
          <div class="weather-copy">
            <div class="weather-city" id="weather-city"></div>
            <div class="weather-temp" id="weather-temp"></div>
            <div class="weather-desc" id="weather-desc"></div>
          </div>
        </div>
      </div>

      <div class="music-card card" id="music-widget" style="display:none">
        <div class="album-box" id="music-album-box">
          <svg class="album-placeholder" id="music-placeholder" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M12 8v14.2a4.7 4.7 0 1 1-2-3.8V11l13-3v11.2a4.7 4.7 0 1 1-2-3.8V5.5z" fill="#40464d"/>
          </svg>
          <img id="music-cover" alt="" style="display:none" />
        </div>

        <div class="music-info">
          <div class="music-marquee" id="music-marquee">
            <div class="music-track" id="music-track"></div>
          </div>
          <img class="music-controls-img" src="assets/icons/music-controls.png" alt="" />
        </div>
      </div>

      <footer class="ticker card" id="promo-bar" style="display:none">
        <div class="ticker-icon-area"><img class="megaphone" src="assets/icons/megaphone.png" alt="" /></div>
        <div class="ticker-window">
          <div class="ticker-track" id="ticker-track"></div>
        </div>
      </footer>

      <!-- A oferta nao tem mais um card de mensagem proprio: a tarjeta
           compartilhada (#promo-bar, sempre visivel por cima de video E
           oferta - ver .ticker no CSS) ja cobre esse papel, sem disputar
           o mesmo espaco da tela com um segundo card. -->
      <div class="oferta-area" id="oferta-area">
        <div class="hero" id="oferta-hero"></div>
        <div class="dots" id="oferta-dots"></div>

        <aside class="card offer-card" id="oferta-panel">
          <div class="offer-label">Oportunidade</div>
          <h1 class="offer-model" id="oferta-model"></h1>

          <div class="meta">
            <div class="meta-row">
              <img class="meta-icon" src="assets/icons/oferta-meta-year.png" alt="" />
              <div class="meta-text" id="oferta-year"></div>
            </div>
            <div class="meta-row">
              <img class="meta-icon" src="assets/icons/oferta-meta-km.png" alt="" />
              <div class="meta-text" id="oferta-km"></div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="price" id="oferta-price"></div>
          <div class="payment" id="oferta-financing"></div>

          <div class="divider"></div>

          <div class="qr-row" id="oferta-qr-row" style="display:none">
            <div class="qr-box"><img class="oferta-qr" id="oferta-qr" alt="" /></div>
            <img class="scan-image" src="assets/icons/oferta-scan-icon.png" alt="" />
          </div>
          <div class="qr-caption" id="oferta-cta">Confira o anúncio completo</div>
        </aside>
      </div>

      <!-- Tela cheia de previsao do tempo: mesmo mecanismo da oferta (exibida
           aleatoriamente entre um video e outro - ver modules/weather-screen.js).
           Nao tem tarjeta propria: usa a mesma #promo-bar compartilhada. -->
      <div class="wx-area" id="wx-area">
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
          <defs>
            <symbol id="wx-icon-cloud" viewBox="0 0 120 85">
              <path d="M24 67h67c14 0 23-9 23-21 0-12-10-21-23-21-4 0-8 1-11 2C75 14 64 7 50 7 32 7 18 20 16 37 7 39 1 46 1 55c0 7 4 12 10 15 4 2 8 3 13 3z" fill="#fff" stroke="#3f8ef7" stroke-width="5" stroke-linejoin="round"/>
            </symbol>
            <symbol id="wx-icon-rain" viewBox="0 0 130 115">
              <use href="#wx-icon-cloud" x="4" y="0" width="120" height="85"/>
              <g fill="none" stroke="#3f8ef7" stroke-width="5" stroke-linecap="round">
                <path d="M26 87l-5 10"/><path d="M53 87l-5 10"/><path d="M80 87l-5 10"/><path d="M107 87l-5 10"/>
              </g>
            </symbol>
            <symbol id="wx-icon-partly" viewBox="0 0 130 105">
              <circle cx="91" cy="29" r="18" fill="#ffc332"/>
              <g stroke="#ffc332" stroke-width="4" stroke-linecap="round">
                <path d="M91 3v8"/><path d="M91 47v8"/><path d="M65 29h8"/><path d="M109 29h8"/><path d="M73 11l6 6"/><path d="M103 41l6 6"/><path d="M109 11l-6 6"/>
              </g>
              <use href="#wx-icon-cloud" x="0" y="20" width="115" height="80"/>
            </symbol>
            <symbol id="wx-icon-sun" viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="19" fill="#ffc332"/>
              <g stroke="#ffc332" stroke-width="4" stroke-linecap="round">
                <path d="M40 4v11M40 65v11M4 40h11M65 40h11M14 14l8 8M58 58l8 8M66 14l-8 8M22 58l-8 8"/>
              </g>
            </symbol>
            <symbol id="wx-icon-thermo-red" viewBox="0 0 40 70">
              <rect x="15" y="5" width="10" height="47" rx="5" fill="#fff" stroke="#222" stroke-width="2"/>
              <circle cx="20" cy="56" r="11" fill="#fff" stroke="#222" stroke-width="2"/>
              <rect x="18" y="22" width="4" height="34" rx="2" fill="#ed3344"/><circle cx="20" cy="56" r="7" fill="#ed3344"/>
              <g stroke="#222" stroke-width="1"><path d="M28 17h5M28 22h3M28 27h5M28 32h3M28 37h5"/></g>
            </symbol>
            <symbol id="wx-icon-thermo-blue" viewBox="0 0 40 70">
              <rect x="15" y="5" width="10" height="47" rx="5" fill="#fff" stroke="#222" stroke-width="2"/>
              <circle cx="20" cy="56" r="11" fill="#fff" stroke="#222" stroke-width="2"/>
              <rect x="18" y="31" width="4" height="25" rx="2" fill="#4c98f2"/><circle cx="20" cy="56" r="7" fill="#4c98f2"/>
              <g stroke="#222" stroke-width="1"><path d="M28 17h5M28 22h3M28 27h5M28 32h3M28 37h5"/></g>
            </symbol>
            <symbol id="wx-icon-drop" viewBox="0 0 50 50">
              <path d="M25 5C18 16 12 22 12 31a13 13 0 0 0 26 0C38 22 32 16 25 5z" fill="none" stroke="#3f8ef7" stroke-width="3.2"/>
            </symbol>
            <symbol id="wx-icon-wind" viewBox="0 0 55 50">
              <g fill="none" stroke="#3f8ef7" stroke-width="3" stroke-linecap="round"><path d="M3 16h30c7 0 7-10 0-10-4 0-6 2-7 5"/><path d="M3 25h40c8 0 8 11 0 11-4 0-7-2-8-5"/><path d="M3 34h20"/></g>
            </symbol>
            <symbol id="wx-icon-sunrise" viewBox="0 0 60 60">
              <path d="M8 43h44" stroke="#222" stroke-width="3"/><path d="M17 42a13 13 0 0 1 26 0" fill="#ffc332" stroke="#ffc332" stroke-width="3"/>
              <g stroke="#ffc332" stroke-width="3" stroke-linecap="round"><path d="M30 9v9M11 29h9M40 29h9M17 17l6 6M43 17l-6 6"/></g><path d="M30 20v15M24 29l6 6 6-6" fill="none" stroke="#222" stroke-width="2.5"/>
            </symbol>
            <symbol id="wx-icon-sunset" viewBox="0 0 60 60">
              <path d="M8 43h44" stroke="#222" stroke-width="3"/><path d="M17 42a13 13 0 0 1 26 0" fill="#f08a68" stroke="#f08a68" stroke-width="3"/>
              <g stroke="#f08a68" stroke-width="3" stroke-linecap="round"><path d="M30 9v9M11 29h9M40 29h9M17 17l6 6M43 17l-6 6"/></g><path d="M30 35V20M24 26l6-6 6 6" fill="none" stroke="#222" stroke-width="2.5"/>
            </symbol>
          </defs>
        </svg>

        <div class="wx-content">
          <div class="wx-title">Previsão do tempo</div>
          <div class="wx-subtitle" id="wx-subtitle">—</div>

          <section class="wx-grid">
            <article class="card wx-card wx-today">
              <div class="wx-today-main">
                <div>
                  <div class="wx-day-head" id="wx-today-label">Hoje</div>
                  <div class="wx-day-date" id="wx-today-date">—</div>
                  <div class="wx-big-condition"><svg class="wx-icon-big" id="wx-today-icon"><use href="#wx-icon-cloud"/></svg></div>
                </div>

                <div class="wx-today-right">
                  <div class="wx-condition-title" id="wx-today-condition">—</div>
                  <div class="wx-separator"></div>

                  <div class="wx-temp-row">
                    <div class="wx-temp-item"><svg class="wx-thermo-icon"><use href="#wx-icon-thermo-red"/></svg><div><div class="wx-temp-label">Máx</div><div class="wx-temp-value" id="wx-today-max">—</div></div></div>
                    <div class="wx-temp-item"><svg class="wx-thermo-icon"><use href="#wx-icon-thermo-blue"/></svg><div><div class="wx-temp-label">Min</div><div class="wx-temp-value" id="wx-today-min">—</div></div></div>
                  </div>

                  <div class="wx-minor-metrics">
                    <div class="wx-minor"><svg><use href="#wx-icon-rain"/></svg><div><div class="wx-minor-name">Chuva</div><div class="wx-minor-value" id="wx-today-rain">—</div></div></div>
                    <div class="wx-minor"><svg><use href="#wx-icon-drop"/></svg><div><div class="wx-minor-name">Umidade</div><div class="wx-minor-value" id="wx-today-humidity">—</div></div></div>
                    <div class="wx-minor"><svg><use href="#wx-icon-wind"/></svg><div><div class="wx-minor-name">Vento</div><div class="wx-minor-value" id="wx-today-wind">—</div></div></div>
                  </div>

                  <div class="wx-sun-row">
                    <div class="wx-sun-item"><svg><use href="#wx-icon-sunrise"/></svg><div><div class="wx-sun-name">Nascer do sol</div><div class="wx-sun-time" id="wx-today-sunrise">—</div></div></div>
                    <div class="wx-sun-item"><svg><use href="#wx-icon-sunset"/></svg><div><div class="wx-sun-name">Pôr do sol</div><div class="wx-sun-time" id="wx-today-sunset">—</div></div></div>
                  </div>
                </div>
              </div>

              <div class="wx-hourly" id="wx-hourly"></div>
            </article>

            <article class="card wx-card wx-next-day" id="wx-tomorrow-card"></article>
            <article class="card wx-card wx-next-day" id="wx-after-card"></article>
          </section>
        </div>
      </div>

      <!-- Transicao de ondas (azul + branca) usada ao trocar de video, e ao
           entrar/sair da oferta e da previsao do tempo (ver modules/
           transition.js). Fica por cima do video/oferta/clima (z-index 8,
           ultimo do DOM) mas por baixo da tarjeta e dos widgets fixos
           (z-index 9/10) - o "letreiro" e os cantos continuam visiveis
           durante a troca. -->
      <div class="wave-transition" id="wave-transition">
        <div class="wave-pair" id="wave-pair">
          <div class="wave-blue"></div>
          <div class="wave-white"></div>
        </div>
      </div>

    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="modules/anchor.js"></script>
  <script src="modules/transition.js"></script>
  <script src="modules/clock.js"></script>
  <script src="modules/weather.js"></script>
  <script src="modules/info-pill.js"></script>
  <script src="modules/logo.js"></script>
  <script src="modules/promo-bar.js"></script>
  <script src="modules/music-widget.js"></script>
  <script src="modules/oferta-player.js"></script>
  <script src="modules/weather-screen.js"></script>
  <script src="modules/video-player.js"></script>
  <script src="player.js"></script>
</body>
</html>
